<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="60%" stop-color="#111417"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A19C"/>
      <stop offset="100%" stop-color="#00E5D5"/>
    </linearGradient>
    <pattern id="checker" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="12" height="12" fill="#0A0A0A"/>
      <rect x="12" y="12" width="12" height="12" fill="#0A0A0A"/>
      <rect x="12" width="12" height="12" fill="#f5f5f5"/>
      <rect y="12" width="12" height="12" fill="#f5f5f5"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- speed lines -->
  <g stroke="#00A19C" stroke-opacity="0.25" stroke-width="2">
    <line x1="-50" y1="60" x2="300" y2="10"/>
    <line x1="-50" y1="90" x2="260" y2="45"/>
    <line x1="-50" y1="120" x2="220" y2="80"/>
  </g>
  <g stroke="#00A19C" stroke-opacity="0.2" stroke-width="2">
    <line x1="900" y1="260" x2="1250" y2="200"/>
    <line x1="940" y1="285" x2="1250" y2="235"/>
  </g>

  <!-- checkered strip top and bottom -->
  <rect x="0" y="0" width="1200" height="10" fill="url(#checker)"/>
  <rect x="0" y="290" width="1200" height="10" fill="url(#checker)"/>

  <!-- accent bar -->
  <rect x="90" y="118" width="6" height="70" fill="url(#accent)"/>

  <!-- main title -->
  <text x="120" y="150" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#F5F5F5" letter-spacing="1">
    MAYCK GOMES
  </text>
  <text x="120" y="182" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#00E5D5" letter-spacing="3">
    BACKEND &amp; MOBILE DEVELOPER
  </text>

  <!-- quote -->
  <text x="120" y="222" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#9AA0A6">
    "The only way to define your limits is by going beyond them."
  </text>
  <text x="120" y="242" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#6b7278">
    — Niki Lauda
  </text>

  <!-- right side minimal track curve -->
  <path d="M 950 40 C 1050 40, 1050 140, 1150 140" stroke="#00A19C" stroke-width="4" fill="none" opacity="0.6"/>
  <path d="M 980 60 C 1060 60, 1060 130, 1140 130" stroke="#f5f5f5" stroke-width="2" fill="none" opacity="0.25" stroke-dasharray="6 6"/>
</svg>
