<svg width="100%" height="180" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Banner Mayck Gomes - Software Engineer, inspirado na livery Mercedes-AMG Petronas F1">
  <defs>
    <linearGradient id="petronasFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00A19C"/>
      <stop offset="100%" stop-color="#00352E"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="200" fill="#0a0a0a"/>

  <polygon points="0,0 460,0 320,200 0,200" fill="#141414"/>
  <polygon points="320,0 600,0 460,200 180,200" fill="#c9cdce"/>
  <polygon points="600,0 740,0 600,200 460,200" fill="url(#petronasFade)"/>
  <polygon points="740,0 1200,0 1200,200 600,200" fill="#0a0a0a"/>

  <line x1="740" y1="0" x2="600" y2="200" stroke="#00E6C3" stroke-width="2.5"/>
  <line x1="600" y1="0" x2="460" y2="200" stroke="#00E6C3" stroke-width="1.5"/>

  <text x="880" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="3" fill="#f4f4f4">MAYCK GOMES</text>
  <text x="880" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="5" fill="#00E6C3">SOFTWARE ENGINEER</text>

  <rect x="790" y="145" width="180" height="1.5" fill="#3a3a3a"/>
  <text x="880" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="3.5" fill="#8a8a8a">CAR 29 · TEAM MG DEV</text>
</svg>
